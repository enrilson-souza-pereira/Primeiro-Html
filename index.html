<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título da aba do navegador -->
    <title>Meus sites favoritos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #2c3e50;
        }
        .site-container {
            margin: 20px auto;
            padding: 15px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
            width: 300px;
        }
        h2 {
            font-size: 1.2rem;
            color: #2980b9;
            margin-bottom: 10px;
        }
        img {
            width: 100%;
            height: 160px;
            object-fit: contain;
            background-color: #ffffff;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        a {
            display: block;
            margin-top: 10px;
            color: #e74c3c;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Título do corpo da página -->
    <h1>Meus sites favoritos: Enrilson Souza Pereira</h1>

    <!-- 1º Site: Amazon Music -->
    <div class="site-container">
        <!-- Nome do site acima da imagem -->
        <h2>Amazon Music</h2>
        <a href="https://music.amazon.com" target="_blank">
            <img src="https://static.amazonmusic.com/dims4/default/1feffd3/2147483647/strip/true/crop/1080x608+0+236/resize/1000x563!/quality/90/?url=https%3A%2F%2Famazon-k1-prod-music2.s3.us-west-2.amazonaws.com%2Fbrightspot%2F00%2F75%2Ffce403944478b583567b6659a7a0%2Fprimary-s.jpg" alt="Amazon Music">
        </a>
        <!-- Link para o site abaixo da imagem -->
        <a href="https://music.amazon.com" target="_blank">Acessar Amazon Music</a>
    </div>

    <br>

    <!-- 2º Site: Netflix -->
    <div class="site-container">
        <!-- Nome do site acima da imagem -->
        <h2>Netflix</h2>
        <a href="https://www.netflix.com" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix">
        </a>
        <!-- Link para o site abaixo da imagem -->
        <a href="https://www.netflix.com" target="_blank">Acessar Netflix</a>
    </div>

    <br>

    <!-- 3º Site: GitHub -->
    <div class="site-container">
        <!-- Nome do site acima da imagem -->
        <h2>GitHub</h2>
        <a href="https://github.com" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/9/91/Octicons-mark-github.svg" alt="GitHub">
        </a>
        <!-- Link para o site abaixo da imagem -->
        <a href="https://github.com" target="_blank">Acessar GitHub</a>
    </div>

    <br>

    <!-- 4º Site: YouTube -->
    <div class="site-container">
        <!-- Nome do site acima da imagem -->
        <h2>YouTube</h2>
        <a href="https://www.youtube.com" target="_blank">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg" alt="YouTube">
        </a>
        <!-- Link para o site abaixo da imagem -->
        <a href="https://www.youtube.com" target="_blank">Acessar YouTube</a>
    </div>

    <br>

    <!-- 5º Site: Reddit -->
    <div class="site-container">
        <!-- Nome do site acima da imagem -->
        <h2>Reddit</h2>
        <a href="https://www.reddit.com" target="_blank">
            <img src="https://logos-world.net/wp-content/uploads/2023/12/Reddit-Logo.png" alt="Reddit">
        </a>
        <!-- Link para o site abaixo da imagem -->
        <a href="https://www.reddit.com" target="_blank">Acessar Reddit</a>
    </div>

</body>
</html>
